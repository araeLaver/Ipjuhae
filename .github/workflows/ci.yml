name: CI

on:
  push:
    branches:
      - main
      - 'auto/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # 기준치 갱신: scripts/check-test-suite-health.mjs의 안내 참고
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    permissions:
      contents: read
    env:
      SKIP_ENV_VALIDATION: true
      JWT_SECRET: ci-dummy-secret-for-build
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Build production container
        run: docker build --tag ipjuhae-ci .

      - name: Verify policy runtime files in production container
        run: |
          docker run --rm --entrypoint node ipjuhae-ci -e '
            const fs = require("node:fs");
            for (const file of ["build/policy-news.cjs", "scripts/migrate-policy-news.cjs", "db/migration-047-policy-news.sql", ".next/required-server-files.json"]) {
              if (!fs.existsSync(file)) throw new Error("Missing runtime file: " + file);
            }
            const collector = require("./build/policy-news.cjs");
            if (typeof collector.startPolicyNewsScheduler !== "function") throw new Error("Scheduler missing");
            if (typeof require("./scripts/migrate-policy-news.cjs").migratePolicyNews !== "function") throw new Error("Release migration missing");
          '
