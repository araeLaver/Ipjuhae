name: Sync secret to Fly

# 저장소 비밀 하나를 Fly 런타임 환경으로 옮긴다.
#
# 왜 있나. 로컬 flyctl 토큰이 만료되면 `flyctl auth login`이 필요한데
# 그건 브라우저 인증이라 비대화형 셸에서 안 된다. 반면 Actions 에는
# 이미 FLY_API_TOKEN 이 있다. 그 경로로 값을 넣는다.
#
# 값은 로그에 찍히지 않는다. 이름만 입력받고 값은 secrets 에서 읽는다.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 옮길 비밀 이름
        required: true
        type: choice
        options:
          - PUBLIC_DATA_API_KEY

concurrency:
  group: fly-sync-secret
  cancel-in-progress: false

jobs:
  sync:
    name: Set Fly secret
    runs-on: ubuntu-latest
    steps:
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Push secret to Fly
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NAME: ${{ inputs.secret_name }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: |
          set -euo pipefail

          # 이름으로 값을 고른다. 값 자체는 변수 밖으로 나가지 않는다.
          case "$NAME" in
            PUBLIC_DATA_API_KEY) VALUE="$PUBLIC_DATA_API_KEY" ;;
            *) echo "::error::허용되지 않은 비밀 이름: $NAME"; exit 1 ;;
          esac

          if [ -z "$VALUE" ]; then
            echo "::error::$NAME 이 저장소 비밀에 없다."
            exit 1
          fi

          # --stage 로 넣고 따로 배포하지 않는다. 바로 반영하면 머신이 재시작되는데,
          # 값 하나 넣자고 운영 재시작을 하는 것보다 다음 배포에 얹히는 편이 안전하다.
          # 지금 바로 필요하면 아래 deploy 한 줄의 주석을 푼다.
          flyctl secrets set "$NAME=$VALUE" --app ipjuhae-production

          echo "::notice::$NAME 을 Fly 에 반영했다."

      - name: Verify
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          if flyctl secrets list --app ipjuhae-production | awk 'NR > 1 { print $1 }' | grep -qx "$NAME"; then
            echo "::notice::$NAME 확인됨."
          else
            echo "::error::$NAME 이 목록에 없다."
            exit 1
          fi
