name: Fly Secret Sync

on:
  workflow_dispatch:
    inputs:
      sms_provider:
        description: 'Production SMS provider'
        required: true
        default: nhn
        type: choice
        options:
          - nhn
          - twilio
      email_provider:
        description: 'Production email provider'
        required: true
        default: resend
        type: choice
        options:
          - resend
          - sendgrid
          - smtp
      verification_provider:
        description: 'Production verification provider'
        required: true
        default: codef
        type: choice
        options:
          - codef
          - nice

jobs:
  sync-operational-secrets:
    name: Sync launch readiness secrets to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validate required secrets
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LAUNCH_SMOKE_TOKEN: ${{ secrets.LAUNCH_SMOKE_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DISCLOSURE_SIGNING_KEY: ${{ secrets.DISCLOSURE_SIGNING_KEY }}
          SMS_PROVIDER: ${{ inputs.sms_provider }}
          NHN_SMS_APP_KEY: ${{ secrets.NHN_SMS_APP_KEY }}
          NHN_SMS_SECRET_KEY: ${{ secrets.NHN_SMS_SECRET_KEY }}
          NHN_SMS_SENDER: ${{ secrets.NHN_SMS_SENDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          EMAIL_PROVIDER: ${{ inputs.email_provider }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          VERIFICATION_PROVIDER: ${{ inputs.verification_provider }}
          CODEF_CLIENT_ID: ${{ secrets.CODEF_CLIENT_ID }}
          CODEF_CLIENT_SECRET: ${{ secrets.CODEF_CLIENT_SECRET }}
          CODEF_PUBLIC_KEY: ${{ secrets.CODEF_PUBLIC_KEY }}
          CODEF_API_BASE: ${{ secrets.CODEF_API_BASE }}
          NICE_CLIENT_ID: ${{ secrets.NICE_CLIENT_ID }}
          NICE_CLIENT_SECRET: ${{ secrets.NICE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="${!name:-}"
            test -n "$value" || { echo "$name is required" >&2; exit 1; }
          }

          require_min_length() {
            local name="$1"
            local min="$2"
            local value="${!name:-}"
            test "${#value}" -ge "$min" || { echo "$name must be at least $min characters" >&2; exit 1; }
          }

          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is required" >&2; exit 1; }
          require_min_length LAUNCH_SMOKE_TOKEN 32
          require_min_length JWT_SECRET 32
          require_min_length CRON_SECRET 32
          require_min_length DISCLOSURE_SIGNING_KEY 32

          case "$SMS_PROVIDER" in
            nhn)
              require_secret NHN_SMS_APP_KEY
              require_secret NHN_SMS_SECRET_KEY
              require_secret NHN_SMS_SENDER
              ;;
            twilio)
              require_secret TWILIO_ACCOUNT_SID
              require_secret TWILIO_AUTH_TOKEN
              require_secret TWILIO_PHONE_NUMBER
              ;;
            *)
              echo "SMS_PROVIDER must be nhn or twilio" >&2
              exit 1
              ;;
          esac

          case "$EMAIL_PROVIDER" in
            resend)
              require_secret RESEND_API_KEY
              ;;
            sendgrid)
              require_secret SENDGRID_API_KEY
              ;;
            smtp)
              require_secret SMTP_HOST
              require_secret SMTP_USER
              require_secret SMTP_PASS
              ;;
            *)
              echo "EMAIL_PROVIDER must be resend, sendgrid, or smtp" >&2
              exit 1
              ;;
          esac

          require_secret S3_ACCESS_KEY_ID
          require_secret S3_SECRET_ACCESS_KEY

          case "$VERIFICATION_PROVIDER" in
            codef)
              require_secret CODEF_CLIENT_ID
              require_secret CODEF_CLIENT_SECRET
              require_secret CODEF_PUBLIC_KEY
              ;;
            nice)
              require_secret NICE_CLIENT_ID
              require_secret NICE_CLIENT_SECRET
              ;;
            *)
              echo "VERIFICATION_PROVIDER must be codef or nice" >&2
              exit 1
              ;;
          esac

      - name: Sync GitHub secrets to Fly
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "LAUNCH_SMOKE_TOKEN=$LAUNCH_SMOKE_TOKEN"
            "JWT_SECRET=$JWT_SECRET"
            "CRON_SECRET=$CRON_SECRET"
            "DISCLOSURE_SIGNING_KEY=$DISCLOSURE_SIGNING_KEY"
            "SMS_PROVIDER=$SMS_PROVIDER"
            "STORAGE_PROVIDER=s3"
            "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"
            "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
            "VERIFICATION_PROVIDER=$VERIFICATION_PROVIDER"
          )

          if [ "$SMS_PROVIDER" = "nhn" ]; then
            args+=(
              "NHN_SMS_APP_KEY=$NHN_SMS_APP_KEY"
              "NHN_SMS_SECRET_KEY=$NHN_SMS_SECRET_KEY"
              "NHN_SMS_SENDER=$NHN_SMS_SENDER"
            )
          else
            args+=(
              "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID"
              "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN"
              "TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER"
            )
          fi

          case "$EMAIL_PROVIDER" in
            resend)
              args+=(
                "EMAIL_PROVIDER=resend"
                "RESEND_API_KEY=$RESEND_API_KEY"
              )
              ;;
            sendgrid)
              args+=(
                "EMAIL_PROVIDER=sendgrid"
                "SENDGRID_API_KEY=$SENDGRID_API_KEY"
              )
              ;;
            smtp)
              flyctl secrets unset EMAIL_PROVIDER --yes --app ipjuhae-production || true
              args+=(
                "SMTP_HOST=$SMTP_HOST"
                "SMTP_USER=$SMTP_USER"
                "SMTP_PASS=$SMTP_PASS"
              )
              [ -n "${SMTP_PORT:-}" ] && args+=("SMTP_PORT=$SMTP_PORT")
              [ -n "${SMTP_FROM:-}" ] && args+=("SMTP_FROM=$SMTP_FROM")
              ;;
          esac

          [ -n "${S3_PUBLIC_URL:-}" ] && args+=("S3_PUBLIC_URL=$S3_PUBLIC_URL")

          if [ "$VERIFICATION_PROVIDER" = "codef" ]; then
            args+=(
              "CODEF_CLIENT_ID=$CODEF_CLIENT_ID"
              "CODEF_CLIENT_SECRET=$CODEF_CLIENT_SECRET"
              "CODEF_PUBLIC_KEY=$CODEF_PUBLIC_KEY"
            )
            [ -n "${CODEF_API_BASE:-}" ] && args+=("CODEF_API_BASE=$CODEF_API_BASE")
          else
            args+=(
              "NICE_CLIENT_ID=$NICE_CLIENT_ID"
              "NICE_CLIENT_SECRET=$NICE_CLIENT_SECRET"
            )
          fi

          flyctl secrets set "${args[@]}" --app ipjuhae-production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LAUNCH_SMOKE_TOKEN: ${{ secrets.LAUNCH_SMOKE_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DISCLOSURE_SIGNING_KEY: ${{ secrets.DISCLOSURE_SIGNING_KEY }}
          SMS_PROVIDER: ${{ inputs.sms_provider }}
          NHN_SMS_APP_KEY: ${{ secrets.NHN_SMS_APP_KEY }}
          NHN_SMS_SECRET_KEY: ${{ secrets.NHN_SMS_SECRET_KEY }}
          NHN_SMS_SENDER: ${{ secrets.NHN_SMS_SENDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          EMAIL_PROVIDER: ${{ inputs.email_provider }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          VERIFICATION_PROVIDER: ${{ inputs.verification_provider }}
          CODEF_CLIENT_ID: ${{ secrets.CODEF_CLIENT_ID }}
          CODEF_CLIENT_SECRET: ${{ secrets.CODEF_CLIENT_SECRET }}
          CODEF_PUBLIC_KEY: ${{ secrets.CODEF_PUBLIC_KEY }}
          CODEF_API_BASE: ${{ secrets.CODEF_API_BASE }}
          NICE_CLIENT_ID: ${{ secrets.NICE_CLIENT_ID }}
          NICE_CLIENT_SECRET: ${{ secrets.NICE_CLIENT_SECRET }}
