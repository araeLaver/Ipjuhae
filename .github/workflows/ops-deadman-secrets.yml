name: 독립 dead-man 비밀 설정 준비

on:
  workflow_dispatch:
    inputs:
      mode:
        description: validate는 검증만, stage는 Fly에 배포 없이 저장
        required: true
        default: validate
        type: choice
        options:
          - validate
          - stage

permissions:
  contents: read

concurrency:
  group: ops-deadman-secrets
  cancel-in-progress: false

jobs:
  prepare:
    name: dead-man 설정 검증 및 staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      OPS_HEARTBEAT_SECRET: ${{ secrets.OPS_HEARTBEAT_SECRET }}
      OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - name: 비밀값 검증
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, re, sys
          token = os.environ.get('OPS_HEARTBEAT_SECRET', '')
          email = os.environ.get('OPS_ALERT_EMAIL', '')
          errors = []
          if not os.environ.get('FLY_API_TOKEN'):
              errors.append('FLY_API_TOKEN이 없습니다.')
          if len(token) < 32 or any(c.isspace() for c in token):
              errors.append('OPS_HEARTBEAT_SECRET은 공백 없는 32자 이상이어야 합니다.')
          # 운영 수신자는 표시 이름/주소 목록 없는 ASCII bare mailbox로 제한합니다.
          local, separator, domain = email.partition('@')
          label = r'[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?'
          valid_email = (
              separator == '@' and len(email) <= 254 and len(local) <= 64
              and re.fullmatch(r"[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*", local)
              and len(domain) <= 253
              and re.fullmatch(label + r'(?:\.' + label + r')+', domain)
          )
          if not valid_email:
              errors.append('OPS_ALERT_EMAIL은 지정된 단일 이메일 주소여야 합니다.')
          if errors:
              for error in errors:
                  print('::error::' + error, file=sys.stderr)
              sys.exit(1)
          print('dead-man 비밀값 형식 검증 완료 (값은 출력하지 않습니다).')
          PYTHON

      - name: Fly CLI 준비
        if: ${{ inputs.mode == 'stage' }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Fly 비밀 저장
        if: ${{ inputs.mode == 'stage' }}
        shell: bash
        run: |
          set -euo pipefail
          # 값을 명령행 인자나 파일에 남기지 않고 stdin으로 전달합니다.
          python3 - <<'PYTHON' | flyctl secrets import --stage --app ipjuhae-production
          import os
          for name in ('OPS_HEARTBEAT_SECRET', 'OPS_ALERT_EMAIL'):
              print(name + '=' + os.environ[name])
          PYTHON
          echo '::notice::dead-man 설정 staging 완료. 기능 활성화와 배포는 별도 집행합니다.'
