# fly.toml app configuration file generated for ipjuhae on 2026-06-09
#
# See https://fly.io/docs/reference/configuration/ for information

app = "ipjuhae-production"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# 주의: 이 앱은 단일 머신으로 운영한다 (2026-08-29 scale count 1).
# Socket.IO/SSE 상태가 인스턴스 로컬이라 2대 이상이면 실시간 메시징이
# 분리된다. 스케일아웃하려면 먼저 Redis 어댑터(Upstash)를 붙일 것.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512

[env]
  PORT = "8000"
  NODE_ENV = "production"
  DB_SCHEMA = "ipjuhae"
  STORAGE_PROVIDER = "s3"
  S3_REGION = "auto"
  S3_BUCKET = "ipjuhae-production"
  S3_ENDPOINT = "https://d8552e241579bbe608445fdbd7f6a407.r2.cloudflarestorage.com"
  NEXT_PUBLIC_APP_URL = "https://www.ipjuhae.com"
  NEXT_PUBLIC_BASE_URL = "https://www.ipjuhae.com"
